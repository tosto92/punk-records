name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran, with their output. Remove anything private from memories or prompts.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`punk-records --version`, `node --version`, and the agent (Claude Code / Codex / OpenCode) with its version"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed via
      options: [Claude Code plugin, Codex plugin, punk-records init --global, punk-records init (per repo)]
      multiple: true
